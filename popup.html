<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 480px;
      min-height: 60px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      gap: 8px;
    }
    header h1 { font-size: 14px; font-weight: 600; color: #e94560; letter-spacing: 0.5px; flex: 0 0 auto; }
    #count { font-size: 11px; color: #888; flex: 1; }
    .hbtn {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    #export-btn { border: 1px solid #4caf50; background: transparent; color: #4caf50; }
    #export-btn:hover { background: #4caf50; color: #fff; }
    #clear-btn  { border: 1px solid #e94560; background: transparent; color: #e94560; }
    #clear-btn:hover  { background: #e94560; color: #fff; }

    #empty { padding: 20px 14px; color: #555; text-align: center; font-size: 12px; }
    #list  { max-height: 420px; overflow-y: auto; }

    .item {
      padding: 9px 14px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .item:hover { background: #16213e; }

    .page-title { font-size: 12px; color: #f0c040; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-url   { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stream-url { font-size: 11px; color: #a8d8ea; word-break: break-all; line-height: 1.4; margin-top: 2px; }

    .row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .time { font-size: 10px; color: #555; flex: 1; }

    .copy-btn {
      font-size: 10px;
      padding: 2px 7px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #a8d8ea;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover  { background: #e94560; border-color: #e94560; color: #fff; }
    .copy-btn.copied { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>M3U8 Detector</h1>
    <span id="count">0 streams</span>
    <button id="export-btn" class="hbtn">Export JSON</button>
    <button id="clear-btn"  class="hbtn">Clear</button>
  </header>
  <div id="empty">No streams detected on this tab.</div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
