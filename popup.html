<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 440px;
      min-height: 60px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e94560;
      letter-spacing: 0.5px;
    }
    header span {
      font-size: 11px;
      color: #888;
    }
    #clear-btn {
      font-size: 11px;
      padding: 3px 9px;
      border: 1px solid #e94560;
      background: transparent;
      color: #e94560;
      border-radius: 4px;
      cursor: pointer;
    }
    #clear-btn:hover { background: #e94560; color: #fff; }

    #empty {
      padding: 20px 14px;
      color: #555;
      text-align: center;
      font-size: 12px;
    }
    #list { max-height: 380px; overflow-y: auto; }
    .item {
      padding: 8px 14px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .item:hover { background: #16213e; }
    .item .url {
      font-size: 11px;
      color: #a8d8ea;
      word-break: break-all;
      line-height: 1.4;
    }
    .item .meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item .time { font-size: 10px; color: #555; flex: 1; }
    .copy-btn {
      font-size: 10px;
      padding: 2px 7px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #a8d8ea;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #e94560; border-color: #e94560; color: #fff; }
    .copy-btn.copied { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>M3U8 Detector</h1>
    <span id="count">0 streams</span>
    <button id="clear-btn">Limpiar</button>
  </header>
  <div id="empty">Sin streams detectados en esta pestaña.</div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
